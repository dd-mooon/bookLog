services:
  postgres:
    image: postgres:16-alpine
    container_name: booklog-postgres
    environment:
      POSTGRES_USER: booklog
      POSTGRES_PASSWORD: booklog
      POSTGRES_DB: booklog
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booklog -d booklog']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
